<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compteur de morts - Overlay Spider-Man</title>

<link href="https://fonts.googleapis.com/css2?family=Eater&family=Anton&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

.compteur-boite {
  position: relative;
  top: 20px;
  left: 20px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 8px 20px 8px 12px;

  background:
    radial-gradient(circle, rgba(255,255,255,0.18) 1.5px, transparent 1.6px) 0 0/10px 10px,
    linear-gradient(135deg, #C41E1E 0%, #8f1414 100%);

  border: 3px solid #111;
  border-radius: 8px;

  box-shadow:
    0 0 0 2px #1B3A8C,
    3px 3px 0 rgba(0,0,0,0.5);

  transform: rotate(-1.5deg);
  user-select: none;
}

.compteur-boite::before,
.compteur-boite::after {
  content: '';
  position: absolute;
  width: 46px;
  height: 46px;
  background-repeat: no-repeat;
  pointer-events: none;
  opacity: 0.55;
}

.compteur-boite::before {
  top: -10px;
  left: 32px;

  background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\
<g fill='none' stroke='%23111' stroke-width='2.5'>\
<path d='M0,0 Q30,10 20,40'/>\
<path d='M0,0 Q15,25 35,25'/>\
<path d='M0,0 Q40,5 45,35'/>\
<path d='M20,40 Q25,20 35,25 Q42,15 45,35'/>\
</g>\
</svg>");
}

.compteur-boite::after {
  bottom: -10px;
  right: 10px;
  transform: rotate(180deg);

  background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\
<g fill='none' stroke='%23111' stroke-width='2.5'>\
<path d='M0,0 Q30,10 20,40'/>\
<path d='M0,0 Q15,25 35,25'/>\
<path d='M0,0 Q40,5 45,35'/>\
<path d='M20,40 Q25,20 35,25 Q42,15 45,35'/>\
</g>\
</svg>");
}


/* LOGO SPIDER-MAN */
.compteur-icone {
  width: 50px;
  height: 50px;

  background-image: url('image_9cd85a.png');

  /* Dernier réglage du cadrage */
  background-size: 320%;
  background-position: center calc(50% + 15px);
  background-repeat: no-repeat;

  background-color: #F5F5F0;

  border-radius: 50%;
  border: 2px solid #111;

  box-sizing: border-box;
  flex-shrink: 0;
  z-index: 1;
  overflow: hidden;
}


/* TEXTE */
.compteur-texte {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
}

.compteur-label {
  font-family: 'Eater', cursive;
  font-size: 22px;
  letter-spacing: 2px;
  line-height: 1;
  color: #F5F5F0;
  -webkit-text-stroke: 1px #111;
  text-transform: uppercase;
  transform: rotate(1deg);
  margin-bottom: 2px;
}

.compteur-chiffre {
  font-family: 'Anton', sans-serif;
  font-size: 34px;
  line-height: 1;
  min-width: 26px;
  text-align: center;
  color: #F5F5F0;
  -webkit-text-stroke: 1.2px #111;
  text-shadow: 2px 2px 0 #1B3A8C;
}
</style>
</head>

<body>

<div class="compteur-boite" id="boite">

  <div class="compteur-icone"></div>

  <div class="compteur-texte">
    <div class="compteur-label">Morts</div>
    <div class="compteur-chiffre" id="chiffre">0</div>
  </div>

</div>

<script>
const chiffreEl = document.getElementById('chiffre');

let compte = parseInt(localStorage.getItem('compteurMorts')) || 0;

chiffreEl.textContent = compte;

function sauvegarder() {
  localStorage.setItem('compteurMorts', compte);
  chiffreEl.textContent = compte;
}

function incrementer() {
  compte++;
  sauvegarder();
}

function decrementer() {
  if (compte > 0) {
    compte--;
  }
  sauvegarder();
}

function reset() {
  compte = 0;
  sauvegarder();
}

/* Clavier */
document.addEventListener('keydown', (e) => {

  if (e.key === 'ArrowUp') {
    incrementer();
  }

  if (e.key === 'ArrowDown') {
    decrementer();
  }

  if (e.key.toLowerCase() === 'r') {
    reset();
  }

});

/* Clic gauche = +1 */
document.getElementById('boite').addEventListener('click', incrementer);

/* Clic droit = -1 */
document.getElementById('boite').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  decrementer();
});
</script>

</body>
</html>
