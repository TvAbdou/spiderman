<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compteur de morts - Overlay Spider-Man</title>

<link href="https://fonts.googleapis.com/css2?family=Eater&family=Anton&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: visible;
  width: 100%;
  height: 100%;
}

.compteur-fil-wrap {
  position: relative;
  display: inline-block;
  padding: 10px; /* Espace pour le contour lumineux */
}

/* ============================================
   COMPTEUR
============================================ */

.compteur-boite {
  position: relative;
  z-index: 1;

  display: inline-flex;
  align-items: center;
  gap: 12px;

  padding: 8px 20px 8px 12px;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.15) 1.5px,
      transparent 1.7px
    ) 0 0 / 10px 10px,

    linear-gradient(
      135deg,
      #C41E1E 0%,
      #8f1414 100%
    );

  /* BORDURE ET OUTLINE BLEU VIF */
  border: 3.5px solid #00d2ff;
  outline: 2.5px solid #0044ff;
  border-radius: 12px;

  /* OMBRE ET GLOW BLEU SPIDER-MAN */
  box-shadow:
    0 0 12px rgba(0, 210, 255, 0.7),
    3px 3px 0 rgba(0,0,0,0.8);

  /* COMPTEUR DROIT */
  transform: rotate(0deg);

  user-select: none;
  cursor: pointer;

  transition:
    box-shadow 0.15s ease,
    transform 0.15s ease;
}

/* Texture comics légère */
.compteur-boite::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    repeating-linear-gradient(
      -12deg,
      transparent 0,
      transparent 11px,
      rgba(0,0,0,0.035) 12px,
      transparent 13px
    );

  border-radius: 8px;
  pointer-events: none;
}

/* ============================================
   LOGO SPIDER-MAN
============================================ */

.compteur-icone {
  width: 50px;
  height: 50px;

  background-image: url('image_9cd85a.png');
  background-size: 360%;
  background-position: center calc(50% + 15px);
  background-repeat: no-repeat;

  background-color: #F5F5F0;

  border-radius: 50%;
  border: 2.5px solid #00d2ff;

  box-sizing: border-box;
  flex-shrink: 0;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: 'Anton', sans-serif;
  font-size: 22px;
  color: #C41E1E;

  box-shadow: 0 0 6px rgba(0, 210, 255, 0.6), 1px 1px 0 rgba(0,0,0,0.4);
}

.compteur-icone .icone-fallback {
  display: none;
}

.compteur-icone.image-manquante {
  background-image: none;
}

.compteur-icone.image-manquante .icone-fallback {
  display: block;
}

/* ============================================
   TEXTE
============================================ */

.compteur-texte {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
}

.compteur-label {
  font-family: 'Eater', cursive;

  font-size: 22px;
  letter-spacing: 2px;
  line-height: 1;

  color: #F5F5F0;

  -webkit-text-stroke: 1px #111;

  text-transform: uppercase;

  transform: rotate(1deg);

  margin-bottom: 2px;

  text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
}

.compteur-chiffre {
  font-family: 'Anton', sans-serif;

  font-size: 34px;
  line-height: 1;

  min-width: 26px;

  text-align: center;

  color: #F5F5F0;

  -webkit-text-stroke: 1.2px #111;

  text-shadow: 2px 2px 0 #0044ff, 0 0 8px #00d2ff;

  display: inline-block;

  transition: transform 0.15s ease;
}

.compteur-chiffre.pop {
  transform: scale(1.35);
}

/* ============================================
   FLASH +1
============================================ */

.compteur-boite.flash-plus {
  box-shadow:
    0 0 0 3px #00d2ff,
    0 0 22px 6px rgba(0,210,255,0.9),
    3px 3px 0 rgba(0,0,0,0.5);
}

/* ============================================
   FLASH -1
============================================ */

.compteur-boite.flash-moins {
  box-shadow:
    0 0 0 3px #0044ff,
    0 0 18px 4px rgba(0,68,255,0.8),
    3px 3px 0 rgba(0,0,0,0.5);
}

/* ============================================
   RESET
============================================ */

.compteur-boite.reset-pending {
  box-shadow:
    0 0 0 3px #f1c40f,
    0 0 20px 6px rgba(241,196,15,0.8),
    3px 3px 0 rgba(0,0,0,0.5);
}

/* ============================================
   POW BLANC
============================================ */

.pow-pop {
  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    scale(0);

  z-index: 3;

  pointer-events: none;
  opacity: 0;
}

.pow-pop.jouer {
  animation:
    pow-anim
    0.4s
    cubic-bezier(.2,1.4,.4,1)
    forwards;
}

@keyframes pow-anim {
  0% {
    transform:
      translate(-50%, -50%)
      scale(0.2)
      rotate(-8deg);
    opacity: 0;
  }

  25% {
    opacity: 1;
  }

  60% {
    transform:
      translate(-50%, -50%)
      scale(1.1)
      rotate(3deg);
    opacity: 1;
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1.3)
      rotate(5deg);
    opacity: 0;
  }
}

.pow-pop svg {
  width: 80px;
  height: 80px;
}
</style>
</head>

<body>

<div class="compteur-fil-wrap">

  <div class="compteur-boite" id="boite">

    <div class="compteur-icone" id="icone">
      <span class="icone-fallback">🕸️</span>
    </div>

    <div class="compteur-texte">

      <div class="compteur-label">
        Morts
      </div>

      <div class="compteur-chiffre" id="chiffre">
        0
      </div>

    </div>

    <!-- Explosion POW -->
    <div class="pow-pop" id="powPop">
      <svg
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">

        <polygon
          points="50,2 61,30 90,20 68,42 98,50 68,58 90,80 61,70 50,98 39,70 10,80 32,58 2,50 32,42 10,20 39,30"
          fill="#F5F5F0"
          stroke="#111"
          stroke-width="3"
        />
      </svg>
    </div>

  </div>
</div>

<script>

/* ============================================
   FALLBACK IMAGE LOGO
============================================ */

const icone = document.getElementById('icone');

const testImg = new Image();

testImg.onerror = () => {
  icone.classList.add('image-manquante');
};

testImg.src = 'image_9cd85a.png';


/* ============================================
   ETAT + PERSISTANCE
============================================ */

const chiffreEl = document.getElementById('chiffre');
const boiteEl = document.getElementById('boite');

const STOCKAGE_KEY = 'compteurMorts';

let compte = 0;

try {
  compte = parseInt(
    localStorage.getItem(STOCKAGE_KEY)
  ) || 0;
} catch (e) {
  console.warn(
    'localStorage indisponible.'
  );
}

chiffreEl.textContent = compte;


/* ============================================
   SAUVEGARDE
============================================ */

function sauvegarder() {

  try {
    localStorage.setItem(
      STOCKAGE_KEY,
      compte
    );
  } catch (e) {
    // Continue en mémoire si localStorage est indisponible.
  }

  chiffreEl.textContent = compte;

  chiffreEl.classList.remove('pop');

  void chiffreEl.offsetWidth;

  chiffreEl.classList.add('pop');
}


/* ============================================
   FLASH
============================================ */

function flash(classe) {

  boiteEl.classList.remove(
    'flash-plus',
    'flash-moins'
  );

  boiteEl.classList.add(classe);

  setTimeout(() => {
    boiteEl.classList.remove(classe);
  }, 200);
}


/* ============================================
   POW
============================================ */

const powEl = document.getElementById('powPop');

function jouerPow() {

  powEl.classList.remove('jouer');

  void powEl.offsetWidth;

  powEl.classList.add('jouer');
}


/* ============================================
   +1
============================================ */

function incrementer() {

  compte++;

  sauvegarder();

  flash('flash-plus');

  jouerPow();
}


/* ============================================
   -1
============================================ */

function decrementer() {

  if (compte > 0) {
    compte--;
  }

  sauvegarder();

  flash('flash-moins');
}


/* ============================================
   RESET
============================================ */

function reset() {

  compte = 0;

  sauvegarder();
}


/* ============================================
   RESET AVEC R MAINTENU 1 SECONDE
============================================ */

let resetTimer = null;

function demarrerReset() {

  if (resetTimer) return;

  boiteEl.classList.add(
    'reset-pending'
  );

  resetTimer = setTimeout(() => {

    reset();

    boiteEl.classList.remove(
      'reset-pending'
    );

    resetTimer = null;

  }, 1000);
}


function annulerReset() {

  if (resetTimer) {

    clearTimeout(resetTimer);

    resetTimer = null;
  }

  boiteEl.classList.remove(
    'reset-pending'
  );
}


/* ============================================
   CLAVIER
============================================ */

document.addEventListener(
  'keydown',
  (e) => {

    if (e.key === 'ArrowUp') {
      incrementer();
    }

    if (e.key === 'ArrowDown') {
      decrementer();
    }

    if (
      e.key.toLowerCase() === 'r'
      && !e.repeat
    ) {
      demarrerReset();
    }

  }
);


document.addEventListener(
  'keyup',
  (e) => {

    if (
      e.key.toLowerCase() === 'r'
    ) {
      annulerReset();
    }

  }
);


/* ============================================
   SOURIS
============================================ */

boiteEl.addEventListener(
  'click',
  incrementer
);

boiteEl.addEventListener(
  'contextmenu',
  (e) => {

    e.preventDefault();

    decrementer();

  }
);

</script>

</body>
</html>
